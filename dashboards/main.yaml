kiosk_mode:
  user_settings:
    - users:
        - guest
        - ship
        - frank
      kiosk: true
      hide_header: true
      hide_sidebar: true
      hide_menu_button: true
  hide_header: true

views:
  - title: Ship
    icon: mdi:sail-boat
    type: masonry
    cards:
      - type: vertical-stack
        cards:
          - type: heading
            heading: Gauges
            icon: mdi:gauge
            heading_style: title
          - square: false
            type: horizontal-stack
            cards:
              - type: custom:gauge-card-pro
                entity: sensor.fuel_port
                needle: true
                gradient: true
                round: full
                segments:
                  - pos: 0
                    color: red
                  - pos: 15
                    color: "#FFA500"
                  - pos: 30
                    color: rgb(255,255,0)
                  - pos: 70
                    color: var(--green-color)
                  - pos: 100
                    color: green
                min_indicator:
                  type: number
                  value: 10
                  color: red
                  label: false
                gradient_resolution: auto
                titles:
                  primary: Fuel pt
                value_texts:
                  primary_font_size_reduction: 7
                card_mod: !include ../ui/renderer-tank.yaml
              - type: custom:gauge-card-pro
                entity: sensor.fuel_starboard
                needle: true
                gradient: true
                round: full
                segments:
                  - pos: 0
                    color: red
                  - pos: 15
                    color: "#FFA500"
                  - pos: 30
                    color: rgb(255,255,0)
                  - pos: 70
                    color: var(--green-color)
                  - pos: 100
                    color: green
                min_indicator:
                  type: number
                  value: 10
                  color: red
                gradient_resolution: auto
                titles:
                  primary: Fuel sb
                value_texts:
                  primary_font_size_reduction: 7
                card_mod: !include ../ui/renderer-tank.yaml
          - square: false
            type: horizontal-stack
            cards:
              - type: custom:gauge-card-pro
                entity: sensor.freshwater_level
                needle: true
                gradient: true
                round: full
                segments:
                  - pos: 0
                    color: red
                  - pos: 15
                    color: "#FFA500"
                  - pos: 30
                    color: rgb(255,255,0)
                  - pos: 70
                    color: var(--green-color)
                  - pos: 100
                    color: green
                min_indicator:
                  type: number
                  value: 10
                  color: red
                gradient_resolution: auto
                titles:
                  primary: Freshwater
                value_texts:
                  primary_font_size_reduction: 7
                card_mod: !include ../ui/renderer-tank.yaml
              - type: custom:gauge-card-pro
                entity: sensor.depth_below_surface
                min: 0
                max: 10
                needle: true
                gradient: true
                round: full
                segments:
                  - pos: 2
                    color: rgb(255,255,0)
                  - pos: 4
                    color: var(--green-color)
                  - pos: 10
                    color: green
                min_indicator:
                  type: number
                  value: 2
                  color: red
                gradient_resolution: auto
                titles:
                  primary: Depth
                value_texts:
                  primary_font_size_reduction: 7
                card_mod: !include ../ui/renderer-depth.yaml
      - type: vertical-stack
        cards:
          - type: heading
            heading: Outside Lights
            icon: mdi:car-light-high
            heading_style: title
          - type: grid
            columns: 4
            square: false
            cards:
              - type: custom:button-card
                name: Sail
                entity: input_select.navigation_mode
                icon: local:navigation-lights
                tap_action:
                  action: call-service
                  service: input_select.select_option
                  service_data:
                    entity_id: input_select.navigation_mode
                    option: |
                      [[[
                        return entity.state === 'navigation'
                          ? 'none'
                          : 'navigation';
                      ]]]
                styles:
                  card:
                    - height: 120px
                    - font-size: 0.85em
                  icon:
                    - height: 64px
                    - width: 64px
                    - color: var(--primary-text-color) !important
                  img_cell:
                    - color: var(--primary-text-color) !important
                state:
                  - value: navigation
                    styles:
                      card:
                        - box-shadow: 0 0 7px 0px gold
                card_mod: !include ../ui/renderer.yaml
              - type: custom:button-card
                name: Steam
                entity: input_select.navigation_mode
                icon: local:steam-light
                tap_action:
                  action: call-service
                  service: input_select.select_option
                  service_data:
                    entity_id: input_select.navigation_mode
                    option: |
                      [[[
                        return entity.state === 'steam'
                          ? 'none'
                          : 'steam';
                      ]]]
                styles:
                  card:
                    - height: 120px
                    - font-size: 0.85em
                  icon:
                    - height: 64px
                    - width: 64px
                    - color: var(--primary-text-color) !important
                  img_cell:
                    - color: var(--primary-text-color) !important
                state:
                  - value: steam
                    styles:
                      card:
                        - box-shadow: 0 0 7px 0px gold
                card_mod: !include ../ui/renderer.yaml
              - type: custom:button-card
                name: Anchor
                entity: input_select.navigation_mode
                icon: local:anchor
                tap_action:
                  action: call-service
                  service: input_select.select_option
                  service_data:
                    entity_id: input_select.navigation_mode
                    option: |
                      [[[
                        return entity.state === 'anchor'
                          ? 'none'
                          : 'anchor';
                      ]]]
                styles:
                  card:
                    - height: 120px
                    - font-size: 0.85em
                  icon:
                    - height: 64px
                    - width: 64px
                    - color: var(--primary-text-color) !important
                  img_cell:
                    - color: var(--primary-text-color) !important
                state:
                  - value: anchor
                    styles:
                      card:
                        - box-shadow: 0 0 7px 0px gold
                card_mod: !include ../ui/renderer.yaml
              - type: custom:button-card
                entity: switch.a16v3_1_output_4
                name: Deck
                icon: local:deck-light
                styles:
                  card:
                    - height: 120px
                    - font-size: 0.85em
                  icon:
                    - height: 58px
                    - color: var(--primary-text-color) !important
                  img_cell:
                    - color: var(--primary-text-color) !important
                state:
                  - value: "on"
                    styles:
                      card:
                        - box-shadow: 0 0 7px 0px gold
                  - value: "off"
                card_mod: !include ../ui/renderer.yaml
      - type: vertical-stack
        cards:
          - type: heading
            heading: Environment
            icon: mdi:gauge-low
            heading_style: title
          - type: horizontal-stack
            square: false
            cards:
              - type: custom:button-card
                entity: sensor.water_temperature
                name: Water Temp.
                show_state: true
                show_units: true
                styles:
                  card:
                    - height: 120px
                    - font-size: 0.85em
                  icon:
                    - height: 58px
                    - width: 58px
                  name:
                    - font-size: 10px
                state:
                  - operator: <=
                    value: 1.5
                    styles:
                      card:
                        - box-shadow: 0 0 7px 0px purple
                  - operator: <=
                    value: 10
                    styles:
                      card:
                        - box-shadow: 0 0 7px 0px blue
                  - operator: <=
                    value: 16
                    styles:
                      card:
                        - box-shadow: 0 0 7px 0px aqua
                  - operator: <=
                    value: 18
                    styles:
                      card:
                        - box-shadow: 0 0 7px 0px teal
                  - operator: ">"
                    value: 18
                    styles:
                      card:
                        - box-shadow: 0 0 7px 0px darkgreen
                card_mod: !include ../ui/renderer.yaml
              - type: custom:button-card
                entity: sensor.co_carbon_monoxide
                name: CO
                show_state: true
                show_units: true
                styles:
                  card:
                    - height: 120px
                    - font-size: 0.85em
                  icon:
                    - height: 64px
                    - width: 64px
                  name:
                    - font-size: 10px
                state:
                  - operator: template
                    value: |
                      [[[ return parseFloat(entity.state) > 150; ]]]
                    styles:
                      card:
                        - animation: blink-shadow 0.8s infinite

                  - operator: template
                    value: |
                      [[[ return parseFloat(entity.state) > 50; ]]]
                    styles:
                      card:
                        - box-shadow: 0 0 7px 2px orange

                  - operator: default
                    styles:
                      card:
                        - box-shadow: 0 0 7px 1px darkgreen
                card_mod: !include ../ui/renderer.yaml
              - type: custom:button-card
                entity: sensor.diesel_since_refill
                name: Diesel Since Refill
                icon: mdi:fuel
                show_state: true
                show_units: true
                styles:
                  card:
                    - height: 120px
                    - font-size: 0.85em
                  icon:
                    - height: 58px
                    - width: 58px
                  name:
                    - font-size: 10px
                card_mod: !include ../ui/renderer.yaml
