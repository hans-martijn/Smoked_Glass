###############################################################################
#
# Smoked Glass Theme 2.0
#
# Glass Renderer
#
# This file assembles the semantic design tokens into the default Home Assistant
# appearance.
#
# IMPORTANT
# ---------
# • Never define colours here.
# • Only consume semantic design tokens.
# • Dashboards should inherit this automatically.
#
###############################################################################


  #########################################################################
  # card-mod
  #########################################################################

  card-mod-theme: Smoked Glass Day

  card-mod-root-yaml: |

    /**********************************************************************
     * Default card
     **********************************************************************/

    ha-card {

      background: var(--card-background-color);

      border-radius: var(--ha-card-border-radius);

      border: 1px solid var(--sg-glass-edge-light);

      box-shadow:
        inset 0 1px var(--sg-glass-reflection-top),
        inset 0 -1px var(--sg-glass-edge-shadow),
        var(--sg-shadow-rest);

      transition:
        background .20s ease,
        border-color .20s ease,
        box-shadow .20s ease,
        transform .20s ease;

      overflow: hidden;

    }

    /**********************************************************************
     * Hover (desktop)
     **********************************************************************/

    ha-card:hover {

      box-shadow:
        inset 0 1px var(--sg-glass-reflection-top),
        inset 0 -1px var(--sg-glass-edge-shadow),
        var(--sg-shadow-hover);

    }

    /**********************************************************************
     * Active / pressed
     **********************************************************************/

    ha-card:active {

      transform: translateY(1px);

      box-shadow:
        inset 0 1px var(--sg-glass-reflection-top),
        inset 0 -1px var(--sg-glass-edge-shadow),
        var(--sg-shadow-active);

    }

    /**********************************************************************
     * Dialogs
     **********************************************************************/

    ha-dialog,
    .mdc-dialog__surface {

      border: 1px solid var(--sg-glass-edge-light);

      box-shadow:
        inset 0 1px var(--sg-glass-reflection-top),
        inset 0 -1px var(--sg-glass-edge-shadow),
        var(--sg-shadow-popup);

    }

    /**********************************************************************
     * Menus
     **********************************************************************/

    mwc-menu,
    mwc-list {

      border: 1px solid var(--sg-glass-edge-light);

      box-shadow:
        inset 0 1px var(--sg-glass-reflection-top),
        var(--sg-shadow-popup);

    }
