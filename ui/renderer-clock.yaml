################################################################################
# Smoked Glass Renderer
#
# Shared visual renderer for all Smoked Glass cards.
#
# Responsibilities:
# - Background
# - Glass effect
# - Reflections
# - Borders
# - Shadows
#
# Extension point:
#   renderer_css:
#     Optional per-card CSS appended to the renderer.
################################################################################

style: |

  ha-card {
    position: relative;
    overflow: hidden;
    text-align: center;
    font-size: 60px;
    color: var(--primary-text-color);
  }

  ha-card::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;

    background:
      linear-gradient(
        175deg,
        var(--sg-glass-highlight-primary) 0%,
        var(--sg-glass-highlight-secondary) 8%,
        var(--sg-glass-highlight-tertiary) 16%,
        transparent 30%
      );
  }

  ha-card::after {
    content: "";
    position: absolute;
    inset: 0;
    padding: 1px;
    border-radius: inherit;
    pointer-events: none;

    background:
      linear-gradient(
        to bottom,
        var(--sg-glass-edge-top) 0,
        transparent 5px
      ),

      linear-gradient(
        to right,
        var(--sg-glass-edge-left) 0,
        transparent 4px
      ),

      linear-gradient(
        to top,
        var(--sg-glass-edge-bottom) 0,
        transparent 3px
      );

    -webkit-mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);

    -webkit-mask-composite: xor;
    mask-composite: exclude;
  }

  {{ config.renderer_css | default("") }}
