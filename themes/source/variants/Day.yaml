###############################################################################
# Smoked Glass
# Design Tokens
#
# Source of truth for all Smoked Glass design variables.
#
# These tokens define the Smoked Glass design language. They should never
# depend on Home Assistant, Material Design or any other implementation layer.
#
#
# IMPORTANT!
#
# This file defines the Smoked Glass design language.
#
# Only semantic design tokens may be defined here.
# Home Assistant, Material Design, Web Awesome and Legacy mappings must never
# introduce visual values directly.
###############################################################################


  ###########################################################################
  # Carbon
  ###########################################################################

  sg-carbon:                 "#0F1113"

  ###########################################################################
  # Glass
  ###########################################################################

  # Base glass colours
  sg-glass-background:       "#181B1D"
  sg-glass-surface:          "#202427"
  sg-glass-handle:           "#2A2F33"

  # Glass backgrounds
  sg-glass-light:            "rgba(24,27,29,0.45)"
  sg-glass-default:          "rgba(24,27,29,0.88)"

  # Floating UI
  sg-popup-background:       "rgba(24,27,29,0.96)"

  ###########################################################################
  # Glass Optics
  ###########################################################################

  # Surface reflections
  sg-glass-highlight-primary:    "rgba(255,255,255,0.14)"
  sg-glass-highlight-secondary:  "rgba(255,255,255,0.05)"
  sg-glass-highlight-tertiary:   "rgba(255,255,255,0.02)"
  sg-glass-highlight-radial:     "rgba(255,255,255,0.10)"

  # Edge lighting
  sg-glass-edge-top:             "rgba(255,255,255,0.18)"
  sg-glass-edge-left:            "rgba(255,255,255,0.14)"
  sg-glass-edge-right:           "rgba(255,255,255,0.01)"
  sg-glass-edge-bottom:          "rgba(255,220,140,0.10)"

  # Frost / depth
  sg-glass-overlay:              "rgba(255,255,255,0.015)"
  sg-glass-backdrop-opacity:     "0.55"

  ###############################################################################
  # Navigation
  ###############################################################################

  sg-sidebar-background:        "rgba(15,17,19,0.92)"
  sg-sidebar-selected:          "rgba(32,36,39,0.70)"

  ###########################################################################
  # Brass
  ###########################################################################

  sg-aged-brass:            "#906E38"
  sg-brass:                 "#B58A46"
  sg-brass-hover:           "#C19652"
  sg-brass-active:          "#D0A762"

  ###########################################################################
  # Text
  ###########################################################################

  sg-text-primary:          "#F0ECE6"
  sg-text-secondary:        "#D8D1C8"
  sg-text-muted:            "#9F9A93"
  sg-text-disabled:         "#6B6762"

  ###########################################################################
  # Typography
  ###########################################################################

  sg-font-family:          "'Orbitron'"

  ###########################################################################
  # Status
  ###########################################################################

  sg-success:               "#4F875F"
  sg-warning:               "#C78D38"
  sg-danger:                "#A5484A"
  sg-info:                  "#4E7DA5"
  sg-focus:                 "rgba(181,138,70,0.35)"

  ###############################################################################
  # Forms
  ###############################################################################

  sg-form-background:          "var(--sg-glass-default)"
  sg-form-background-disabled: "rgba(24,27,29,0.50)"

  sg-form-line:                "rgba(255,255,255,0.10)"
  sg-form-line-hover:          "var(--sg-brass)"

  sg-form-icon:                "var(--sg-brass)"

  ###########################################################################
  # Borders
  ###########################################################################

  sg-border-soft:           "rgba(255,255,255,0.04)"
  sg-border-medium:         "rgba(255,255,255,0.08)"
  sg-border-strong:         "rgba(255,255,255,0.12)"

  ###############################################################################
  # Dividers
  ###############################################################################

  sg-divider:              "rgba(255,255,255,0.05)"

  ###############################################################################
  # Shadows
  ###############################################################################

  sg-shadow-soft:           "0 4px 12px rgba(0,0,0,0.18)"
  sg-shadow-medium:         "0 8px 18px rgba(0,0,0,0.25)"
  sg-shadow-floating:       "0 12px 32px rgba(0,0,0,0.30)"

  sg-shadow-rest:      "var(--sg-shadow-soft)"
  sg-shadow-hover:     "var(--sg-shadow-medium)"
  sg-shadow-active:    "var(--sg-shadow-medium)"
  sg-shadow-popup:     "var(--sg-shadow-floating)"

  ###############################################################################
  # Glow
  ###############################################################################

  sg-glow-radius:      "18px"
  sg-glow-spread:      "3px"
  sg-glow-opacity:     "0.40"

  sg-glow-gold:        "181,138,70"
  sg-glow-white:       "255,235,190"

  ###############################################################################
  # Tooltips
  ###############################################################################

  sg-tooltip-background: "var(--sg-popup-background)"

  ###############################################################################
  # Sliders
  ###############################################################################

  sg-slider-track:           "rgba(255,255,255,0.14)"

  ###############################################################################
  # Switches
  ###############################################################################

  sg-switch-track:          "rgba(255,255,255,0.12)"
  sg-switch-track-active:   "rgba(181,138,70,0.45)"

  ###############################################################################
  # State Layers
  ###############################################################################

  sg-state-layer-resting:    "rgba(181,138,70,0.08)"
  sg-state-layer-hover:      "rgba(181,138,70,0.12)"

  ###############################################################################
  # Lists
  ###############################################################################

  sg-list-item-hover: "rgba(181,138,70,0.10)"

  ###############################################################################
  # Tables
  ###############################################################################

  sg-table-row-alternate: "rgba(255,255,255,0.02)"

  ###############################################################################
  # Scrollbars
  ###############################################################################

  sg-scrollbar-thumb: "rgba(255,255,255,0.20)"

  ###############################################################################
  # Text Selection
  ###############################################################################

  sg-text-selection:       "rgba(181,138,70,0.25)"

  ###############################################################################
  # Ripples
  ###############################################################################

  sg-ripple: "rgba(181,138,70,0.16)"

  ###############################################################################
  # Selection Controls
  ###############################################################################

  sg-selection-control-disabled: "rgba(255,255,255,0.20)"

  ###############################################################################
  # Chips
  ###############################################################################

  sg-chip-selected: "rgba(181,138,70,0.20)"

  ###############################################################################
  # Buttons
  ###############################################################################

  sg-button-outline: "rgba(181,138,70,0.40)"

  ###############################################################################
  # Cards
  ###############################################################################

  sg-card-radius: "14px"
  sg-card-border-width: "1px"
