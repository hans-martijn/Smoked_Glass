################################################################################
#
# SMOKED GLASS 2.0
# Bellezza Vela Design System
#
# ------------------------------------------------------------------------------
#
# Milestone 1
#
# Objective
#
# Remove the remaining Home Assistant identity while introducing the
# Bellezza Vela design language.
#
# This theme is organised by design concepts rather than Home Assistant
# variables. Every section describes WHY something exists before HOW it
# is implemented.
#
################################################################################

Smoked Glass 2.0:

################################################################################
#
# MATERIAL LIBRARY
#
# These are the only colours that should ever exist inside the theme.
#
################################################################################

  ##########################################################################
  # Hull
  ##########################################################################

  sg-hull:                  "#0F1113"

  ##########################################################################
  # Smoked Glass
  ##########################################################################

  sg-glass-100:             "#181B1D"
  sg-glass-200:             "#202427"
  sg-glass-300:             "#2A2F33"
  sg-glass-400:             "#353B40"

  ##########################################################################
  # Marine Brass
  ##########################################################################

  sg-old-brass:             "#906E38"
  sg-brass:                 "#B58A46"
  sg-brass-hover:           "#C19652"
  sg-brass-active:          "#D0A762"

  ##########################################################################
  # Typography
  ##########################################################################

  sg-text-primary:          "#F0ECE6"
  sg-text-secondary:        "#D8D1C8"
  sg-text-muted:            "#9F9A93"
  sg-text-disabled:         "#6B6762"

  ##########################################################################
  # Semantic Colours
  ##########################################################################

  sg-success:               "#4F875F"
  sg-warning:               "#C78D38"
  sg-danger:                "#A5484A"
  sg-water:                 "#4E7DA5"

  sg-focus:                 "rgba(181,138,70,0.35)"

  ##########################################################################
  # Glass Details
  ##########################################################################

  sg-border-soft:           "rgba(255,255,255,0.04)"
  sg-border-medium:         "rgba(255,255,255,0.08)"
  sg-border-strong:         "rgba(255,255,255,0.12)"

  sg-shadow-soft:           "0 4px 12px rgba(0,0,0,0.18)"
  sg-shadow-medium:         "0 8px 18px rgba(0,0,0,0.25)"
  sg-shadow-floating:       "0 12px 32px rgba(0,0,0,0.30)"

################################################################################
#
# TYPOGRAPHY
#
# Bellezza Vela never uses pure white.
#
################################################################################

  primary-text-color:       "var(--sg-text-primary)"
  text-primary-color:       "var(--sg-text-primary)"

  secondary-text-color:     "var(--sg-text-secondary)"

  disabled-text-color:      "var(--sg-text-disabled)"

################################################################################
#
# BACKGROUNDS
#
# Cards should appear to float above the wallpaper.
#
################################################################################

  primary-background-color:     "var(--sg-glass-100)"
  secondary-background-color:   "var(--sg-glass-200)"

  lovelace-background:          "var(--sg-hull)"

  app-header-background-color:  "rgba(24,27,29,0.75)"

################################################################################
#
# CARDS
#
# Cards are made from smoked glass.
#
################################################################################

  card-background-color:        "rgba(24,27,29,0.75)"
  ha-card-background:           "rgba(24,27,29,0.75)"

  ha-card-border-radius:        "14px"

  ha-card-border-width:         "1px"

  ha-card-border-color:         "var(--sg-border-soft)"

  ha-card-box-shadow:           "var(--sg-shadow-soft)"

################################################################################
#
# DIVIDERS
#
################################################################################

  divider-color:                "rgba(255,255,255,0.05)"

################################################################################
#
# ICONS
#
################################################################################

  state-icon-color:             "var(--sg-text-muted)"

  state-icon-active-color:      "var(--sg-brass)"

################################################################################
#
# SIDEBAR
#
# Calm.
# Quiet.
# Never dominant.
#
################################################################################

  sidebar-background-color:     "rgba(15,17,19,0.92)"

  sidebar-icon-color:           "var(--sg-text-muted)"

  sidebar-text-color:           "var(--sg-text-secondary)"

  sidebar-selected-icon-color:  "var(--sg-brass)"

  sidebar-selected-text-color:  "var(--sg-text-primary)"

  sidebar-selected-background-color: "rgba(32,36,39,0.70)"

################################################################################
#
# LINKS
#
# Brass represents interaction.
#
################################################################################

  primary-color:                "var(--sg-brass)"

  accent-color:                 "var(--sg-brass)"

################################################################################
#
# STATUS COLOURS
#
################################################################################

  success-color:                "var(--sg-success)"

  warning-color:                "var(--sg-warning)"

  error-color:                  "var(--sg-danger)"

  info-color:                   "var(--sg-water)"

################################################################################
#
# FORMS
#
# Milestone 2
#
# Objective:
# Eliminate the remaining white Material Design components.
#
################################################################################

  ##########################################################################
  # Legacy HA form colours (these are proven to work)
  ##########################################################################

  ha-color-form-background:              "rgba(24,27,29,0.88)"
  ha-color-form-background-hover:        "rgba(32,36,39,0.92)"
  ha-color-form-background-disabled:     "rgba(24,27,29,0.55)"

  ha-color-form-ink-color:               "var(--sg-text-primary)"

  ##########################################################################
  # Text fields
  ##########################################################################

  ha-textfield-fill-color:               "rgba(24,27,29,0.88)"
  ha-textfield-ink-color:                "var(--sg-text-primary)"

  input-fill-color:                      "rgba(24,27,29,0.88)"
  input-disabled-fill-color:             "rgba(24,27,29,0.50)"

  input-ink-color:                       "var(--sg-text-primary)"
  input-label-ink-color:                 "var(--sg-text-secondary)"

  input-disabled-ink-color:              "var(--sg-text-disabled)"

  input-idle-line-color:                 "rgba(255,255,255,0.10)"
  input-hover-line-color:                "var(--sg-brass)"

  input-dropdown-icon-color:             "var(--sg-brass)"

  ##########################################################################
  # Material text fields
  ##########################################################################

  mdc-text-field-fill-color:             "rgba(24,27,29,0.88)"

  mdc-text-field-idle-line-color:        "rgba(255,255,255,0.10)"
  mdc-text-field-hover-line-color:       "var(--sg-brass)"

  mdc-text-field-label-ink-color:        "var(--sg-text-secondary)"

  ##########################################################################
  # Material selects
  ##########################################################################

  mdc-select-fill-color:                 "rgba(24,27,29,0.88)"

  mdc-select-idle-line-color:            "rgba(255,255,255,0.10)"
  mdc-select-hover-line-color:           "var(--sg-brass)"

  mdc-select-label-ink-color:            "var(--sg-text-secondary)"

  ##########################################################################
  # Menus
  ##########################################################################

  material-menu-background-color:        "rgba(24,27,29,0.96)"
  material-menu-color:                   "var(--sg-text-primary)"

  ##########################################################################
  # Dialogs
  ##########################################################################

  dialog-background-color:               "rgba(24,27,29,0.95)"
  paper-dialog-background-color:         "rgba(24,27,29,0.95)"

  mdc-dialog-container-color:            "rgba(24,27,29,0.95)"

  mdc-dialog-heading-ink-color:          "var(--sg-text-primary)"
  mdc-dialog-supporting-text-color:      "var(--sg-text-secondary)"

  ##########################################################################
  # Search fields
  ##########################################################################

  search-bar-background-color:           "rgba(24,27,29,0.88)"

  ##########################################################################
  # Lists
  ##########################################################################

  material-list-item-selected-color:     "var(--sg-brass)"
  material-list-item-hover-color:        "rgba(181,138,70,0.10)"

################################################################################
#
# MILESTONE 3
#
# HOME ASSISTANT EXORCISM
#
# Objective:
# Remove the remaining Home Assistant identity.
#
################################################################################

  ##########################################################################
  # Home Assistant Design Tokens
  ##########################################################################

  ha-color-primary:                "var(--sg-brass)"
  ha-color-primary-40:             "var(--sg-brass)"
  ha-color-primary-50:             "var(--sg-brass)"
  ha-color-primary-60:             "var(--sg-brass)"

  ha-color-text-link:              "var(--sg-brass)"

  ha-color-focus:                  "var(--sg-focus)"

  ha-color-fill-primary-quiet-hover: "var(--sg-glass-300)"
  ha-color-fill-primary-quiet-resting: "var(--sg-glass-300)"

  light-primary-color: "var(--sg-old-brass)"

  ##########################################################################
  # Material Design
  ##########################################################################

  md-sys-color-primary:              "var(--sg-brass)"

  ##########################################################################
  # Radio buttons
  ##########################################################################

  ha-radio-option-active-color:              "var(--sg-brass)"
  ha-radio-option-checked-background-color:  "rgba(181,138,70,0.18)"

