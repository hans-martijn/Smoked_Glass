  ha-tooltip-text-color:              "var(--sg-text-primary)"

  ##########################################################################
  # Snackbars
  ##########################################################################

  mdc-snackbar-container-color:       "rgba(24,27,29,0.96)"
  mdc-snackbar-supporting-text-color: "var(--sg-text-primary)"

